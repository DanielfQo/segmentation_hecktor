# B1: B0 con etiquetas suaves (fraccion de tumor por voxel).
# Igual que siam_full.yaml salvo el preprocesado: ROI de 300 mm, ancla relativa al tejido blando del paciente
# y etiquetas 'suave' (bifusion3d.data.preproc). Comparar con runs/siam_full en validacion.
# Paso 2: codificador siames completo (pesos compartidos) con fusion en cada nivel (Sigma, CIPA, vMambaX).
# Compuerta canal x espacio en los niveles 0-3 y Cross/Concat Mamba (intercambio de C + escaneo [CT; PET]) en los niveles 4-5.
# Mismo protocolo que modelos/mamba/configs/full.yaml (split 70/20/10 por centro, semilla, 250 epocas, patch,
# validacion intermedia con 21 casos): solo cambia la red, para comparar con full_base_fold0 en validacion.
experiment: b1_siam_full_suave
seed: 12345

data:
  root: ../../HECKTOR2025_raw
  cases_per_center: null
  split:
    mode: stratified          # 70/20/10 dentro de cada centro (mismo split que full_base_fold0)
    fractions: [0.7, 0.2, 0.1]
  target_spacing_xyz: [1.0, 1.0, 3.0]
  etiquetas: suave
  roi:
    down_mm: 300
    ancla: relativa
  pet_norm: zscore
  load_threads: 2
  max_cached_cases: 60      # ~60 MB por caso en RAM -> ~3.6 GB
  refresh_per_epoch: 10

model:
  variant: siam_full
  patch_size_zyx: [32, 128, 128]
  chunk_size: 8

train:
  epochs: 250
  iters_per_epoch: 250
  batch_size: 2
  save_every: 1             # checkpoint de reanudacion en cada epoca
  val_every: 25
  val_cases_during_training: 21   # igual que full_base_fold0

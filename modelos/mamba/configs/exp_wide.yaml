# Experimento de capacidad: MambaLite3D mas ancho (variante wide), mismo split 70/20/10 y mismo patch que full.yaml.
experiment: exp_wide
seed: 12345

data:
  root: ../../HECKTOR2025_raw
  cases_per_center: null
  split:
    mode: stratified          # 70/20/10 dentro de cada centro (test de la misma distribucion)
    fractions: [0.7, 0.2, 0.1]
  target_spacing_xyz: [1.0, 1.0, 3.0]
  pet_norm: zscore
  load_threads: 2
  max_cached_cases: 60      # ~60 MB por caso en RAM -> ~3.6 GB; subelo si tienes mas RAM libre
  refresh_per_epoch: 10

model:
  variant: wide              # 15,8 M parametros, 1,8 GB, ~0,8 s/it en la RTX 3050
  patch_size_zyx: [32, 128, 128]
  chunk_size: 8

train:
  epochs: 250
  iters_per_epoch: 250
  batch_size: 2
  save_every: 1             # checkpoint de reanudacion en cada epoca (se pierde como mucho 1 epoca)
  val_every: 25
  val_cases_during_training: null  # todos los casos de validacion: el mejor checkpoint se elige con los 135

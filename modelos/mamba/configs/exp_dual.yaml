# Doble codificador (CT y PET por separado, fusion por nivel en los skips), variante base.
# Mismo split, patch, 250 epocas y validacion rapida (21 casos) que full.yaml, para comparar con base.
experiment: exp_dual
seed: 12345

data:
  root: ../../HECKTOR2025_raw
  cases_per_center: null
  split:
    mode: stratified          # 70/20/10 dentro de cada centro (test de la misma distribucion)
    fractions: [0.7, 0.2, 0.1]
  target_spacing_xyz: [1.0, 1.0, 3.0]
  pet_norm: zscore
  load_threads: 2
  max_cached_cases: 60      # ~60 MB por caso en RAM -> ~3.6 GB; subelo si tienes mas RAM libre
  refresh_per_epoch: 10

model:
  variant: dual              # 5,3 M parametros, 1,2 GB, ~0,41 s/it con mamba_ssm
  patch_size_zyx: [32, 128, 128]
  chunk_size: 8

train:
  epochs: 250
  iters_per_epoch: 250
  batch_size: 2
  save_every: 1             # checkpoint de reanudacion en cada epoca (se pierde como mucho 1 epoca)
  val_every: 25
  val_cases_during_training: 21   # validacion rapida cada val_every epocas (3 por centro); guarda checkpoint_best

# Experimento PET en SUV absoluto: igual que full.yaml (base), pero el PET se normaliza como
# min(SUV, 20) / 20 en vez de z-score por paciente, para que la red vea la captacion real.
# Motivo: los ganglios falsos grandes estan en zonas de poca captacion (TAREAS.md, seccion 3).
experiment: exp_suv
seed: 12345

data:
  root: ../../HECKTOR2025_raw
  cases_per_center: null
  split:
    mode: stratified          # 70/20/10 dentro de cada centro (mismo split que full.yaml)
    fractions: [0.7, 0.2, 0.1]
  target_spacing_xyz: [1.0, 1.0, 3.0]
  pet_norm: clip            # SUV absoluto
  suv_clip: 20
  load_threads: 2
  max_cached_cases: 60      # ~60 MB por caso en RAM -> ~3.6 GB; subelo si tienes mas RAM libre
  refresh_per_epoch: 10

model:
  variant: base
  patch_size_zyx: [32, 128, 128]
  chunk_size: 8

train:
  epochs: 250
  iters_per_epoch: 250
  batch_size: 2
  save_every: 1             # checkpoint de reanudacion en cada epoca (se pierde como mucho 1 epoca)
  val_every: 25
  val_cases_during_training: 21   # igual que full.yaml (base)
